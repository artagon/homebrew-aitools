# Builds, tests, and bottles changed formulae. Adapted from `brew tap-new`.
# brew pr-pull (publish.yml) uploads the bottle artifacts of this workflow.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  # scripts/autobump.sh dispatches this on bump branches, because pull requests
  # opened with GITHUB_TOKEN start no pull_request run.
  workflow_dispatch:
    inputs:
      formulae:
        description: Formulae to build, test, and bottle, separated by spaces
        required: false

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: Build, test, and bottle (${{ matrix.os }})
    strategy:
      matrix:
        # The macOS 26 runner is Apple Silicon. Its bottles also pour on newer macOS.
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Read-only token: pull requests from forks run here with no secrets.
    permissions:
      actions: read # brew test-bot reads workflow run metadata
      checks: read # brew test-bot reads check runs of the commit under test
      contents: read # check out the tap
      pull-requests: read # brew test-bot reads the pull request and its labels
    steps:
      # No `token:` input: the tap is public, and setup-homebrew would store the
      # token in the global Git config, readable by the code this job builds.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      # No dependency cache: this job produces the bottles that publish.yml
      # ships, so it must not restore state that another run could have written.

      - name: Trust this tap
        run: brew trust --tap artagon/aitools

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Build, test, and bottle formulae
        if: github.event_name != 'push'
        env:
          FORMULAE: ${{ inputs.formulae }}
        run: |
          read -r -a formulae <<< "${FORMULAE}"
          for formula in ${formulae[@]+"${formulae[@]}"}; do
            if [[ ! "${formula}" =~ ^artagon/aitools/[a-z0-9][a-z0-9@._+-]*$ ]]; then
              echo "::error::Not a formula of this tap: ${formula}"
              exit 1
            fi
          done
          brew test-bot --only-formulae ${formulae[@]+"${formulae[@]}"}

      # test-bot leaves each tested formula installed from its new bottle.
      - name: Run installer integration tests
        if: github.event_name != 'push'
        run: |
          if ! brew list --formula ripwire >/dev/null 2>&1; then
            echo "ripwire was not built in this run"
            exit 0
          fi
          brew install bash jq
          python3 tests/integration_agent_install.py \
            --receipt "${RUNNER_TEMP}/ripwire-integration.json" \
            --bash32 /bin/bash \
            --modern-bash "$(brew --prefix)/bin/bash"

      # Only a passing run uploads bottles: brew pr-pull checks that the run
      # completed, not that it passed.
      - name: Upload bottles as artifact
        if: success() && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
