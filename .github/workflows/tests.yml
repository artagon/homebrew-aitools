# Builds, tests, and bottles changed formulae. Adapted from `brew tap-new`.
# brew pr-pull (publish.yml) uploads the bottle artifacts of this workflow.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  # scripts/autobump.py dispatches this on bump branches, because pull requests
  # opened with GITHUB_TOKEN start no pull_request run.
  workflow_dispatch:
    inputs:
      formulae:
        description: Formulae to build, test, and bottle, separated by spaces
        required: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        # The macOS 26 runner is Apple Silicon. Its bottles also pour on newer macOS.
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Trust this tap
        run: brew trust --tap artagon/aitools

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Build, test, and bottle formulae
        if: github.event_name != 'push'
        env:
          FORMULAE: ${{ inputs.formulae }}
        run: |
          read -r -a formulae <<< "${FORMULAE}"
          brew test-bot --only-formulae ${formulae[@]+"${formulae[@]}"}

      # test-bot leaves each tested formula installed from its new bottle.
      - name: Run installer integration tests
        if: github.event_name != 'push'
        run: |
          if ! brew list --formula ripwire >/dev/null 2>&1; then
            echo "ripwire was not built in this run"
            exit 0
          fi
          brew install bash jq
          python3 tests/integration_agent_install.py \
            --receipt "${RUNNER_TEMP}/ripwire-integration.json" \
            --bash32 /bin/bash \
            --modern-bash "$(brew --prefix)/bin/bash"

      - name: Upload bottles as artifact
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
