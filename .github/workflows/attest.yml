# Backfills or refreshes cryptographic build provenance, SBOMs, and Sigstore
# bundles for bottles already published on GitHub Releases and pinned in
# Formula/*.rb on main.
# Run from main:
#   gh workflow run attest.yml
#   gh workflow run attest.yml -f formulae="ripwire ast-grep-valhalla"
name: Attest published bottles

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formula names (empty = all bottled formulae on main)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: bottle-releases
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  stage-releases:
    name: Stage published bottles and SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # check out main and download published GitHub Release bottles
    outputs:
      release_map_sha256: ${{ steps.stage.outputs.release_map_sha256 }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: true

      - name: Install Anchore syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0

      - name: Download published bottles, verify Formula sha256, and generate SBOMs
        id: stage
        env:
          FORMULAE: ${{ inputs.formulae }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/brew-xdg
        run: |
          fail() {
            echo "::error::$*"
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || fail "Run attest.yml from main, not ${GITHUB_REF}"

          export USER="${USER:-$(id -un)}"
          mkdir -p "${XDG_CONFIG_HOME}"
          brew trust --tap artagon/aitools

          target_list=()
          if [[ -n "${FORMULAE}" ]]; then
            read -r -a requested <<< "${FORMULAE}"
            for name in "${requested[@]}"; do
              [[ "${name}" =~ ^[a-z0-9][a-z0-9@._+-]*$ ]] || fail "Invalid formula name: ${name}"
              [[ -f "Formula/${name}.rb" ]] || fail "Formula/${name}.rb does not exist"
              target_list+=( "${name}" )
            done
          else
            for rb in Formula/*.rb; do
              name="$(basename "${rb}" .rb)"
              if grep -Eq '^[[:space:]]*bottle do$' "${rb}"; then
                target_list+=( "${name}" )
              fi
            done
          fi
          (( ${#target_list[@]} > 0 )) || fail "No bottled formulae selected"

          tsv_path="${RUNNER_TEMP}/bottles.tsv"
          brew ruby -e '
            require "formula"
            require "bottle"
            ARGV.each do |name|
              f = Formulary.factory("artagon/aitools/#{name}")
              spec = f.bottle_specification
              tag_sym = :arm64_tahoe
              abort "No #{tag_sym} bottle in #{name}" unless spec.tag?(tag_sym)
              tag_spec = spec.collector.specification_for(tag_sym)
              fn = Bottle::Filename.new(f.name, f.pkg_version, tag_sym, spec.rebuild)
              puts [
                f.name,
                f.pkg_version.to_s,
                spec.root_url,
                spec.rebuild.to_s,
                tag_sym.to_s,
                fn.to_s,
                fn.url_encode,
                tag_spec.checksum.hexdigest
              ].join("\t")
            end
          ' -- "${target_list[@]}" > "${tsv_path}"

          stage_dir="${RUNNER_TEMP}/attest-stage"
          mkdir -p "${stage_dir}/files"
          entries_jsonl="${RUNNER_TEMP}/map-entries.jsonl"
          : > "${entries_jsonl}"

          while IFS=$'\t' read -r formula pkg_version root_url rebuild tag brew_fn rel_fn expected_sha; do
            release_tag="${formula}-${pkg_version}"
            expected_root="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
            [[ "${root_url}" == "${expected_root}" ]] ||
              fail "Unexpected root_url ${root_url} in Formula/${formula}.rb (expected ${expected_root})"

            bottle_dest="${stage_dir}/files/${rel_fn}"
            curl --fail --location --silent --show-error --retry 3 \
              --output "${bottle_dest}" \
              "${root_url}/${rel_fn}"

            actual_sha="$(sha256sum "${bottle_dest}" | awk '{print $1}')"
            [[ "${actual_sha}" == "${expected_sha}" ]] ||
              fail "Downloaded bottle ${rel_fn} digest mismatch: expected ${expected_sha}, got ${actual_sha}"

            spdx_dest="${stage_dir}/files/${rel_fn}.spdx.json"
            cdx_dest="${stage_dir}/files/${rel_fn}.cdx.json"
            syft scan "file:${bottle_dest}" \
              --source-name "${formula}" \
              --source-version "${pkg_version}" \
              --select-catalogers "+javascript-package-cataloger" \
              -o "spdx-json=${spdx_dest}" \
              -o "cyclonedx-json=${cdx_dest}"

            spdx_sha="$(sha256sum "${spdx_dest}" | awk '{print $1}')"
            cdx_sha="$(sha256sum "${cdx_dest}" | awk '{print $1}')"

            jq -c -n \
              --arg formula "${formula}" \
              --arg pkg_version "${pkg_version}" \
              --arg release_tag "${release_tag}" \
              --arg root_url "${root_url}" \
              --argjson rebuild "${rebuild}" \
              --arg tag "${tag}" \
              --arg brew_filename "${brew_fn}" \
              --arg release_filename "${rel_fn}" \
              --arg bottle_sha256 "${actual_sha}" \
              --arg spdx_sha256 "${spdx_sha}" \
              --arg cdx_sha256 "${cdx_sha}" \
              '{
                formula: $formula,
                pkg_version: $pkg_version,
                release_tag: $release_tag,
                root_url: $root_url,
                rebuild: $rebuild,
                tag: $tag,
                brew_filename: $brew_filename,
                release_filename: $release_filename,
                bottle_sha256: $bottle_sha256,
                spdx_sha256: $spdx_sha256,
                cdx_sha256: $cdx_sha256
              }' >> "${entries_jsonl}"
          done < "${tsv_path}"

          jq -s '{
            schema: "artagon-bottle-release-map/v1",
            bottles: .
          }' "${entries_jsonl}" > "${stage_dir}/release-map.json"

          map_sha="$(sha256sum "${stage_dir}/release-map.json" | awk '{print $1}')"
          echo "release_map_sha256=${map_sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload staged release bottles and SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest-stage
          path: ${{ runner.temp }}/attest-stage/*
          retention-days: 1

  sign-bottles:
    name: Sign and attest bottles
    needs: stage-releases
    permissions:
      actions: read # download attest-stage artifact
      attestations: write # store SLSA v1 and bottle-lineage/v1 attestations
      contents: write # upload provenance sidecars to existing GitHub Releases
      id-token: write # mint OIDC tokens for GitHub Attestations and Sigstore Fulcio
    uses: ./.github/workflows/sign-bottles.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax for local reusable workflows.
    with:
      mode: backfill
      release_map_sha256: ${{ needs.stage-releases.outputs.release_map_sha256 }}
      stage_artifact: attest-stage

  verify-homebrew:
    name: Verify Homebrew and CLI provenance on macOS
    needs:
      - stage-releases
      - sign-bottles
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read # download attest-stage release map
      attestations: read # verify GitHub Attestations via gh and scripts/verify-provenance.sh
      contents: read # check out main and fetch release assets
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: true

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Download release map
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attest-stage
          path: ${{ runner.temp }}/attest-stage

      - name: Verify attested formulae via Homebrew and verify-provenance.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MAP_SHA256: ${{ needs.stage-releases.outputs.release_map_sha256 }}
        run: |
          stage_dir="${RUNNER_TEMP}/attest-stage"
          actual_sha="$(shasum -a 256 "${stage_dir}/release-map.json" | awk '{print $1}')"
          [[ "${actual_sha}" == "${RELEASE_MAP_SHA256}" ]]

          formulae=()
          while IFS= read -r formula; do
            [[ -n "${formula}" ]] && formulae+=( "${formula}" )
          done < <(jq -r '.bottles[].formula' "${stage_dir}/release-map.json")

          ./scripts/verify-provenance.sh --require-cosign --homebrew "${formulae[@]}"
