# Publishes the bottles that tests.yml built for a pull request, attests and
# signs them in an isolated OIDC job, pushes bottle + README provenance commits
# to main, publishes the draft releases, and verifies Homebrew attestations.
# Review the pull request first, then run from main:
#   gh workflow run publish.yml -f pull_request=<number> -f head_sha=<reviewed commit>
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Full SHA of the pull request head commit you reviewed
        required: true
        type: string
      allow_missing_manifest:
        description: Allow legacy PRs built before provenance_macos-26 existed
        required: false
        default: false
        type: boolean
      allow_workflow_changes:
        description: Allow publishing a PR that also modifies .github/workflows/ or scripts/ci/
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: bottle-releases
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  stage-bottles:
    name: Stage bottles and commits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Strictly read-only: no OIDC token, no attestations, and no repository writes.
    permissions:
      actions: read # download pinned tests.yml bottle and provenance artifacts
      checks: read # inspect check suites on the reviewed pull request head
      contents: read # check out the tap and inspect pull request commits
      issues: read # brew pr-pull reads pull request labels
      pull-requests: read # validate pull request state and head commit
    outputs:
      base_main_sha: ${{ steps.stage.outputs.base_main_sha }}
      release_map_sha256: ${{ steps.stage.outputs.release_map_sha256 }}
      test_run_id: ${{ steps.validate.outputs.test_run_id }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: true

      - name: Snapshot trusted CI scripts from main
        run: |
          rm -rf -- "${RUNNER_TEMP}/trusted-scripts"
          cp -R scripts "${RUNNER_TEMP}/trusted-scripts"

      - name: Validate pull request and download verified builder artifacts
        id: validate
        env:
          ALLOW_MISSING_MANIFEST: ${{ inputs.allow_missing_manifest }}
          ALLOW_WORKFLOW_CHANGES: ${{ inputs.allow_workflow_changes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" validate

      - name: Trust this tap
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/brew-xdg
        run: |
          export USER="${USER:-$(id -un)}"
          mkdir -p "${XDG_CONFIG_HOME}"
          brew trust --tap artagon/aitools

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Install Anchore syft for legacy fallback SBOMs
        if: inputs.allow_missing_manifest
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0

      - name: Prepare bottle commits, README provenance table, and stage map
        id: stage
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          TEST_RUN_ID: ${{ steps.validate.outputs.test_run_id }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/brew-xdg
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" stage

      - name: Upload staged commits and bottles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-stage
          path: ${{ runner.temp }}/publish-stage/*
          retention-days: 1

  sign-bottles:
    name: Sign and attest bottles
    needs: stage-bottles
    permissions:
      actions: read # download publish-stage and verify provenance_macos-26 digest
      attestations: write # store SLSA v1 and bottle-lineage/v1 attestations
      contents: write # create draft releases and upload bottles and provenance sidecars
      id-token: write # mint OIDC tokens for GitHub Attestations and Sigstore Fulcio
    uses: ./.github/workflows/sign-bottles.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax for local reusable workflows.
    with:
      allow_missing_manifest: ${{ inputs.allow_missing_manifest }}
      head_sha: ${{ inputs.head_sha }}
      mode: publish
      release_map_sha256: ${{ needs.stage-bottles.outputs.release_map_sha256 }}
      stage_artifact: publish-stage
      test_run_id: ${{ needs.stage-bottles.outputs.test_run_id }}

  push-main:
    name: Push commits, publish releases, and verify bottles
    needs:
      - stage-bottles
      - sign-bottles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # download publish-stage artifact
      attestations: read # brew verify queries GitHub Attestations API
      contents: write # fast-forward main and publish draft GitHub Releases
      pull-requests: write # close pull request if still open at reviewed head_sha
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: true

      - name: Snapshot trusted CI scripts from main
        run: |
          rm -rf -- "${RUNNER_TEMP}/trusted-scripts"
          cp -R scripts "${RUNNER_TEMP}/trusted-scripts"

      - name: Download staged commits and release map
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-stage
          path: ${{ runner.temp }}/publish-stage

      - name: Set up git
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Verify staged patch policy and apply commits
        env:
          BASE_MAIN_SHA: ${{ needs.stage-bottles.outputs.base_main_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RELEASE_MAP_SHA256: ${{ needs.stage-bottles.outputs.release_map_sha256 }}
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" verify-patch-policy

      # One try: if main moved since the check, fail instead of rebasing these
      # bottles onto code they were not built against.
      - name: Push commits to main
        id: push
        uses: Homebrew/actions/git-try-push@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          tries: 1

      - name: Publish draft GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" publish-releases

      - name: Clean up unshipped draft releases on push failure
        if: failure() && steps.push.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" cleanup-drafts

      - name: Verify published bottles with Homebrew attestation gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/brew-verify-xdg
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" verify-homebrew

      - name: Close pull request if still open at reviewed head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: bash "${RUNNER_TEMP}/trusted-scripts/ci/publish-bottles.sh" close-pr
