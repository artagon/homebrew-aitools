# Reusable OIDC bottle-signing and provenance-attestation workflow.
#
# Security boundary:
# - Must execute ONLY on `refs/heads/main` so Fulcio X.509 certificates carry the
#   ref-bound SAN:
#     https://github.com/artagon/homebrew-aitools/.github/workflows/sign-bottles.yml@refs/heads/main
# - Evaluates zero untrusted code: checks out `refs/heads/main`, verifies the caller's
#   `release-map.json` SHA-256, and in `publish` mode independently verifies each
#   builder job's `provenance_*` ZIP digest and `head_sha` via the GitHub API.
# - Mints a single SLSA v1 statement and a single `bottle-lineage/v1` statement binding
#   BOTH `--` (`Bottle::Filename#to_s`, verified by Homebrew) and `-`
#   (`Bottle::Filename#url_encode`, uploaded to GitHub Releases) filenames per bottle.
name: Sign and attest bottles

on:
  workflow_call:
    inputs:
      mode:
        description: Signing mode ('publish' or 'backfill')
        required: true
        type: string
      stage_artifact:
        description: Artifact uploaded by the staging job containing release-map.json and files/
        required: true
        type: string
      release_map_sha256:
        description: Expected SHA-256 hex digest of release-map.json
        required: true
        type: string
      head_sha:
        description: Reviewed PR head commit SHA (required when mode == 'publish')
        required: false
        default: ""
        type: string
      test_run_id:
        description: Passing tests.yml run ID (required when mode == 'publish')
        required: false
        default: ""
        type: string
      allow_missing_manifest:
        description: Allow legacy PRs built before provenance_* artifacts existed
        required: false
        default: false
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  sign:
    name: Attest, sign, verify, and upload provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # inspect tests.yml run and artifact digests via GitHub API
      attestations: write # store SLSA v1 and bottle-lineage/v1 attestations
      contents: write # upload bottles (publish draft) and provenance sidecars
      id-token: write # request OIDC tokens for GitHub Attestations and Sigstore Fulcio
    steps:
      - name: Check out trusted main scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download staged bottles and SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.stage_artifact }}
          path: stage

      - name: Validate release map, verify builder manifest, and stage subjects
        env:
          ALLOW_MISSING_MANIFEST: ${{ inputs.allow_missing_manifest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MODE: ${{ inputs.mode }}
          RELEASE_MAP_SHA256: ${{ inputs.release_map_sha256 }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
        run: ./scripts/ci/sign-and-attest.sh prepare

      - name: Attest SLSA v1 build provenance
        id: attest_slsa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: work/subject-checksums.txt

      - name: Attest signed bottle lineage and SBOM digests
        id: attest_lineage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: work/subject-checksums.txt
          predicate-type: https://github.com/artagon/homebrew-aitools/bottle-lineage/v1
          predicate-path: work/lineage.json

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign blobs, attest SPDX SBOMs, and self-verify all bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAGE_BUNDLE: ${{ steps.attest_lineage.outputs.bundle-path }}
          SLSA_BUNDLE: ${{ steps.attest_slsa.outputs.bundle-path }}
        run: ./scripts/ci/sign-and-attest.sh sign-and-verify

      - name: Upload signed assets to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: ./scripts/ci/sign-and-attest.sh upload
