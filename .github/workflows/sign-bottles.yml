# Canonical reusable bottle signing and attestation workflow.
# Both publish.yml and attest.yml call this workflow from refs/heads/main so
# every bottle in the tap carries one uniform Fulcio SAN:
#   https://github.com/artagon/homebrew-aitools/.github/workflows/sign-bottles.yml@refs/heads/main
# Untrusted code, Homebrew Ruby, and SBOM scanners never run in this job.
# zizmor: ignore[concurrency-limits] -- Callers share group `bottle-releases`; setting it here would deadlock the caller.
name: Sign and attest bottles

on:
  workflow_call:
    inputs:
      stage_artifact:
        description: Artifact uploaded by the caller in this workflow run
        required: true
        type: string
      release_map_sha256:
        description: Expected SHA-256 digest of stage/release-map.json
        required: true
        type: string
      mode:
        description: Execution mode (publish or backfill)
        required: true
        type: string
      head_sha:
        description: Reviewed pull request head commit SHA (publish mode)
        required: false
        default: ""
        type: string
      test_run_id:
        description: Passing tests.yml workflow run ID (publish mode)
        required: false
        default: ""
        type: string
      allow_missing_manifest:
        description: Allow legacy PRs built before provenance_macos-26 existed
        required: false
        default: false
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  sign:
    name: Sign and attest bottles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # download staged inputs and verify tests.yml provenance artifact digest
      attestations: write # store SLSA v1 and bottle-lineage/v1 attestations
      contents: write # upload bottles (draft) and provenance sidecars to GitHub Releases
      id-token: write # mint OIDC tokens for GitHub Attestations and Sigstore Fulcio
    steps:
      - name: Download staged inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.stage_artifact }}
          path: stage

      - name: Validate staged bottles and builder lineage
        env:
          ALLOW_MISSING_MANIFEST: ${{ inputs.allow_missing_manifest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MODE: ${{ inputs.mode }}
          RELEASE_MAP_SHA256: ${{ inputs.release_map_sha256 }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
        run: |
          fail() {
            echo "::error::$*"
            exit 1
          }

          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || fail "sign-bottles.yml must run on refs/heads/main, not ${GITHUB_REF}"
          [[ "${MODE}" == "publish" || "${MODE}" == "backfill" ]] || fail "Invalid mode: ${MODE}"
          [[ "${RELEASE_MAP_SHA256}" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid release_map_sha256: ${RELEASE_MAP_SHA256}"
          [[ -f stage/release-map.json ]] || fail "stage/release-map.json is missing"

          actual_map_sha="$(sha256sum stage/release-map.json | awk '{print $1}')"
          [[ "${actual_map_sha}" == "${RELEASE_MAP_SHA256}" ]] ||
            fail "release-map.json SHA-256 mismatch: expected ${RELEASE_MAP_SHA256}, got ${actual_map_sha}"

          jq -e '.schema == "artagon-bottle-release-map/v1" and (.bottles | type == "array" and length > 0)' \
            stage/release-map.json >/dev/null || fail "Invalid release-map.json schema or empty bottle list"

          builder_head_sha=""
          builder_workflow=""
          builder_run_id=""
          builder_run_attempt=""
          prov_artifact_digest=""
          lineage_status="backfill-unverified"

          if [[ "${MODE}" == "publish" ]]; then
            [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "publish mode requires 40-hex head_sha"
            [[ "${TEST_RUN_ID}" =~ ^[0-9]+$ ]] || fail "publish mode requires numeric test_run_id"

            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}")"
            [[ "$(jq -r .path <<< "${run_json}")" == ".github/workflows/tests.yml" ]] ||
              fail "Run ${TEST_RUN_ID} is not .github/workflows/tests.yml"
            [[ "$(jq -r .head_repository.full_name <<< "${run_json}")" == "${GITHUB_REPOSITORY}" ]] ||
              fail "Run ${TEST_RUN_ID} is not from ${GITHUB_REPOSITORY}"
            [[ "$(jq -r .conclusion <<< "${run_json}")" == "success" ]] ||
              fail "Run ${TEST_RUN_ID} did not conclude with success"
            run_event="$(jq -r .event <<< "${run_json}")"
            [[ "${run_event}" == "pull_request" || "${run_event}" == "workflow_dispatch" ]] ||
              fail "Unexpected event ${run_event} on run ${TEST_RUN_ID}"

            builder_head_sha="${HEAD_SHA}"
            builder_workflow=".github/workflows/tests.yml"
            builder_run_id="${TEST_RUN_ID}"
            builder_run_attempt="$(jq -r '.run_attempt | tostring' <<< "${run_json}")"

            arts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}/artifacts?per_page=100")"
            prov_art="$(jq -c '[.artifacts[] | select(.name == "provenance_macos-26" and .expired == false)] | first // empty' <<< "${arts_json}")"

            if [[ -z "${prov_art}" ]]; then
              if [[ "${ALLOW_MISSING_MANIFEST}" == "true" ]]; then
                lineage_status="publish-legacy-no-manifest"
                echo "::warning::Allowing missing provenance_macos-26 on run ${TEST_RUN_ID} via explicit override"
                echo "### Provenance override: missing \`provenance_macos-26\` allowed on run \`${TEST_RUN_ID}\`" >> "${GITHUB_STEP_SUMMARY}"
              else
                fail "Run ${TEST_RUN_ID} has no active provenance_macos-26 artifact (set allow_missing_manifest=true only for pre-provenance PRs)"
              fi
            else
              lineage_status="verified-builder-manifest"
              prov_id="$(jq -r '.id | tostring' <<< "${prov_art}")"
              prov_artifact_digest="$(jq -r '.digest // empty' <<< "${prov_art}")"
              [[ "${prov_artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] ||
                fail "Artifact ${prov_id} missing valid sha256 digest: ${prov_artifact_digest}"

              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${prov_id}/zip" > "${RUNNER_TEMP}/verified-prov.zip"
              zip_sha="sha256:$(sha256sum "${RUNNER_TEMP}/verified-prov.zip" | awk '{print $1}')"
              [[ "${zip_sha}" == "${prov_artifact_digest}" ]] ||
                fail "Artifact ${prov_id} digest mismatch: expected ${prov_artifact_digest}, got ${zip_sha}"

              unzip -p "${RUNNER_TEMP}/verified-prov.zip" build-manifest.json > "${RUNNER_TEMP}/verified-build-manifest.json"
              jq -e \
                --arg head "${HEAD_SHA}" \
                --arg run_id "${TEST_RUN_ID}" \
                '.schema == "artagon-bottle-build-manifest/v1" and .head_sha == $head and .run_id == $run_id' \
                "${RUNNER_TEMP}/verified-build-manifest.json" >/dev/null ||
                fail "build-manifest.json head_sha or run_id does not match ${HEAD_SHA} / ${TEST_RUN_ID}"
            fi
          fi

          mkdir -p work out
          : > work/subject-checksums.txt

          bottle_count="$(jq '.bottles | length' stage/release-map.json)"
          for (( i = 0; i < bottle_count; i++ )); do
            entry="$(jq -c ".bottles[${i}]" stage/release-map.json)"
            formula="$(jq -r .formula <<< "${entry}")"
            pkg_version="$(jq -r .pkg_version <<< "${entry}")"
            release_tag="$(jq -r .release_tag <<< "${entry}")"
            brew_fn="$(jq -r .brew_filename <<< "${entry}")"
            rel_fn="$(jq -r .release_filename <<< "${entry}")"
            bottle_sha="$(jq -r .bottle_sha256 <<< "${entry}")"
            spdx_sha="$(jq -r .spdx_sha256 <<< "${entry}")"
            cdx_sha="$(jq -r .cdx_sha256 <<< "${entry}")"

            [[ "${formula}" =~ ^[a-z0-9][a-z0-9@._+-]*$ ]] || fail "Invalid formula name: ${formula}"
            [[ "${pkg_version}" =~ ^[0-9A-Za-z._+-]+$ ]] || fail "Invalid pkg_version: ${pkg_version}"
            [[ "${release_tag}" == "${formula}-${pkg_version}" ]] || fail "Unexpected release_tag ${release_tag}"
            [[ "${brew_fn}" =~ ^[A-Za-z0-9@._+-]+$ && "${brew_fn}" != *".."* ]] || fail "Unsafe brew_filename: ${brew_fn}"
            [[ "${rel_fn}" =~ ^[A-Za-z0-9@.%_+-]+$ && "${rel_fn}" != *".."* ]] || fail "Unsafe release_filename: ${rel_fn}"
            [[ "${bottle_sha}" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid bottle_sha256 for ${formula}"
            [[ "${spdx_sha}" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid spdx_sha256 for ${formula}"
            [[ "${cdx_sha}" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid cdx_sha256 for ${formula}"

            [[ -f "stage/files/${rel_fn}" ]] || fail "Missing staged bottle stage/files/${rel_fn}"
            [[ -f "stage/files/${rel_fn}.spdx.json" ]] || fail "Missing staged SPDX stage/files/${rel_fn}.spdx.json"
            [[ -f "stage/files/${rel_fn}.cdx.json" ]] || fail "Missing staged CycloneDX stage/files/${rel_fn}.cdx.json"

            [[ "$(sha256sum "stage/files/${rel_fn}" | awk '{print $1}')" == "${bottle_sha}" ]] ||
              fail "Staged bottle digest mismatch for ${rel_fn}"
            [[ "$(sha256sum "stage/files/${rel_fn}.spdx.json" | awk '{print $1}')" == "${spdx_sha}" ]] ||
              fail "Staged SPDX digest mismatch for ${rel_fn}.spdx.json"
            [[ "$(sha256sum "stage/files/${rel_fn}.cdx.json" | awk '{print $1}')" == "${cdx_sha}" ]] ||
              fail "Staged CycloneDX digest mismatch for ${rel_fn}.cdx.json"

            if [[ "${lineage_status}" == "verified-builder-manifest" ]]; then
              jq -e \
                --arg formula "${formula}" \
                --arg pkg_version "${pkg_version}" \
                --arg brew_fn "${brew_fn}" \
                --arg rel_fn "${rel_fn}" \
                --arg bottle_sha "${bottle_sha}" \
                --arg spdx_sha "${spdx_sha}" \
                --arg cdx_sha "${cdx_sha}" \
                'any(.bottles[];
                  .formula == $formula
                  and .pkg_version == $pkg_version
                  and .brew_filename == $brew_fn
                  and .release_filename == $rel_fn
                  and .bottle_sha256 == $bottle_sha
                  and .spdx_sha256 == $spdx_sha
                  and .cdx_sha256 == $cdx_sha
                )' "${RUNNER_TEMP}/verified-build-manifest.json" >/dev/null ||
                fail "Entry ${rel_fn} does not match verified build-manifest.json from run ${TEST_RUN_ID}"
            fi

            if [[ "${MODE}" == "publish" ]]; then
              if pub_rel="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null)"; then
                if jq -e --arg name "${rel_fn}" 'any(.assets[]; .name == $name)' <<< "${pub_rel}" >/dev/null; then
                  fail "Asset ${rel_fn} already exists on published release ${release_tag}; bump revision or rebuild instead of overwriting"
                fi
              fi
            fi

            cp "stage/files/${rel_fn}" "work/${rel_fn}"
            if [[ "${brew_fn}" != "${rel_fn}" ]]; then
              cp "stage/files/${rel_fn}" "work/${brew_fn}"
            fi
            printf '%s  %s\n' "${bottle_sha}" "${brew_fn}" >> work/subject-checksums.txt
            printf '%s  %s\n' "${bottle_sha}" "${rel_fn}" >> work/subject-checksums.txt
          done

          attested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --slurpfile map stage/release-map.json \
            --arg mode "${MODE}" \
            --arg lineage_status "${lineage_status}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg signer "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-bottles.yml@refs/heads/main" \
            --arg signer_sha "${GITHUB_SHA}" \
            --arg builder_head "${builder_head_sha}" \
            --arg builder_wf "${builder_workflow}" \
            --arg builder_run "${builder_run_id}" \
            --arg builder_attempt "${builder_run_attempt}" \
            --arg prov_digest "${prov_artifact_digest}" \
            --arg attested_at "${attested_at}" \
            '{
              schema: "https://github.com/artagon/homebrew-aitools/bottle-lineage/v1",
              mode: $mode,
              lineage_status: $lineage_status,
              repository: $repo,
              signer_workflow: $signer,
              signer_commit_sha: $signer_sha,
              builder_head_sha: (if $builder_head == "" then null else $builder_head end),
              builder_workflow: (if $builder_wf == "" then null else $builder_wf end),
              builder_run_id: (if $builder_run == "" then null else $builder_run end),
              builder_run_attempt: (if $builder_attempt == "" then null else $builder_attempt end),
              provenance_artifact_digest: (if $prov_digest == "" then null else $prov_digest end),
              attested_at: $attested_at,
              bottles: $map[0].bottles
            }' > work/lineage.json

      - name: Attest SLSA v1 build provenance
        id: attest_slsa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: work/subject-checksums.txt

      - name: Attest signed bottle lineage and SBOM digests
        id: attest_lineage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: work/subject-checksums.txt
          predicate-type: https://github.com/artagon/homebrew-aitools/bottle-lineage/v1
          predicate-path: work/lineage.json

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign blobs, attest SPDX SBOMs, and self-verify all bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAGE_BUNDLE: ${{ steps.attest_lineage.outputs.bundle-path }}
          SLSA_BUNDLE: ${{ steps.attest_slsa.outputs.bundle-path }}
        run: |
          fail() {
            echo "::error::$*"
            exit 1
          }

          export TUF_ROOT="${RUNNER_TEMP}/cosign-tuf"
          mkdir -p "${TUF_ROOT}"

          gh_trusted_root="${RUNNER_TEMP}/trusted_root.jsonl"
          cosign_trusted_root="${RUNNER_TEMP}/sigstore-trusted-root.json"
          gh attestation trusted-root > "${gh_trusted_root}"
          jq -c -s '
            map(select(.mediaType == "application/vnd.dev.sigstore.trustedroot+json;version=0.1"))
            | (map(select(tostring | contains("sigstore.dev")))[0] // .[0])
          ' "${gh_trusted_root}" > "${cosign_trusted_root}"

          cert_id="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-bottles.yml@refs/heads/main"
          oidc_issuer="https://token.actions.githubusercontent.com"
          lineage_type="https://github.com/artagon/homebrew-aitools/bottle-lineage/v1"

          bottle_count="$(jq '.bottles | length' stage/release-map.json)"
          for (( i = 0; i < bottle_count; i++ )); do
            entry="$(jq -c ".bottles[${i}]" stage/release-map.json)"
            formula="$(jq -r .formula <<< "${entry}")"
            brew_fn="$(jq -r .brew_filename <<< "${entry}")"
            rel_fn="$(jq -r .release_filename <<< "${entry}")"
            bottle_sha="$(jq -r .bottle_sha256 <<< "${entry}")"
            spdx_sha="$(jq -r .spdx_sha256 <<< "${entry}")"
            cdx_sha="$(jq -r .cdx_sha256 <<< "${entry}")"

            cp "${SLSA_BUNDLE}" "out/${rel_fn}.intoto.jsonl"
            cp "${LINEAGE_BUNDLE}" "out/${rel_fn}.lineage.intoto.jsonl"
            cp "stage/files/${rel_fn}.spdx.json" "out/${rel_fn}.spdx.json"
            cp "stage/files/${rel_fn}.cdx.json" "out/${rel_fn}.cdx.json"
            printf '%s  %s\n' "${bottle_sha}" "${rel_fn}" > "out/${rel_fn}.sha256"

            jq --arg rel_fn "${rel_fn}" '
              .bottle = (.bottles[] | select(.release_filename == $rel_fn))
              | del(.bottles)
            ' work/lineage.json > "out/${rel_fn}.provenance.json"

            cosign sign-blob \
              --yes \
              --bundle "out/${rel_fn}.sigstore.json" \
              "work/${rel_fn}"

            cosign attest-blob \
              --yes \
              --type spdxjson \
              --predicate "out/${rel_fn}.spdx.json" \
              --bundle "out/${rel_fn}.spdx.sigstore.json" \
              "work/${rel_fn}"

            # 1. Online SLSA v1 provenance check (ref-bound SAN + atomic dual-subject check)
            online_json="${RUNNER_TEMP}/verify-online-${i}.json"
            gh attestation verify "work/${rel_fn}" \
              --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${cert_id}" \
              --source-ref "refs/heads/main" \
              --deny-self-hosted-runners \
              --format json > "${online_json}"
            jq -e \
              --arg san "${cert_id}" \
              --arg brew_fn "${brew_fn}" \
              --arg rel_fn "${rel_fn}" \
              --arg sha "${bottle_sha}" \
              'any(.[];
                .verificationResult.signature.certificate.subjectAlternativeName == $san
                and (
                  .verificationResult.statement.subject as $s
                  | any($s[]; .name == $brew_fn and .digest.sha256 == $sha)
                  and any($s[]; .name == $rel_fn and .digest.sha256 == $sha)
                )
              )' "${online_json}" >/dev/null || fail "Online SLSA dual-subject check failed for ${formula}"

            # 2. Air-gapped SLSA v1 bundle check with custom trusted root
            offline_json="${RUNNER_TEMP}/verify-offline-${i}.json"
            gh attestation verify "work/${rel_fn}" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle "out/${rel_fn}.intoto.jsonl" \
              --custom-trusted-root "${gh_trusted_root}" \
              --cert-identity "${cert_id}" \
              --source-ref "refs/heads/main" \
              --deny-self-hosted-runners \
              --format json > "${offline_json}"
            jq -e \
              --arg san "${cert_id}" \
              --arg brew_fn "${brew_fn}" \
              --arg rel_fn "${rel_fn}" \
              --arg sha "${bottle_sha}" \
              'any(.[];
                .verificationResult.signature.certificate.subjectAlternativeName == $san
                and (
                  .verificationResult.statement.subject as $s
                  | any($s[]; .name == $brew_fn and .digest.sha256 == $sha)
                  and any($s[]; .name == $rel_fn and .digest.sha256 == $sha)
                )
              )' "${offline_json}" >/dev/null || fail "Offline SLSA bundle check failed for ${formula}"

            # 3. Air-gapped bottle-lineage/v1 bundle check authenticating SBOM digests
            lineage_json="${RUNNER_TEMP}/verify-lineage-${i}.json"
            gh attestation verify "work/${rel_fn}" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle "out/${rel_fn}.lineage.intoto.jsonl" \
              --custom-trusted-root "${gh_trusted_root}" \
              --predicate-type "${lineage_type}" \
              --cert-identity "${cert_id}" \
              --source-ref "refs/heads/main" \
              --deny-self-hosted-runners \
              --format json > "${lineage_json}"
            jq -e \
              --arg rel_fn "${rel_fn}" \
              --arg sha "${bottle_sha}" \
              --arg spdx_sha "${spdx_sha}" \
              --arg cdx_sha "${cdx_sha}" \
              'any(.[];
                any(.verificationResult.statement.predicate.bottles[];
                  .release_filename == $rel_fn
                  and .bottle_sha256 == $sha
                  and .spdx_sha256 == $spdx_sha
                  and .cdx_sha256 == $cdx_sha
                )
              )' "${lineage_json}" >/dev/null || fail "Signed bottle-lineage check failed for ${formula}"

            # 4. Air-gapped Sigstore cosign v3 blob signature check
            cosign verify-blob \
              --bundle "out/${rel_fn}.sigstore.json" \
              --trusted-root "${cosign_trusted_root}" \
              --certificate-identity "${cert_id}" \
              --certificate-oidc-issuer "${oidc_issuer}" \
              "work/${rel_fn}"

            # 5. Air-gapped Sigstore cosign v3 SPDX attestation check + DSSE predicate equality
            cosign verify-blob-attestation \
              --bundle "out/${rel_fn}.spdx.sigstore.json" \
              --trusted-root "${cosign_trusted_root}" \
              --type spdxjson \
              --certificate-identity "${cert_id}" \
              --certificate-oidc-issuer "${oidc_issuer}" \
              "work/${rel_fn}"

            dsse_spdx="${RUNNER_TEMP}/dsse-spdx-${i}.json"
            detached_spdx="${RUNNER_TEMP}/detached-spdx-${i}.json"
            jq -r '.dsseEnvelope.payload' "out/${rel_fn}.spdx.sigstore.json" |
              base64 --decode |
              jq -S '.predicate' > "${dsse_spdx}"
            jq -S '.' "out/${rel_fn}.spdx.json" > "${detached_spdx}"
            cmp -s "${dsse_spdx}" "${detached_spdx}" ||
              fail "Detached SPDX JSON does not match signed DSSE predicate for ${rel_fn}"
          done

      - name: Upload signed assets to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          bottle_count="$(jq '.bottles | length' stage/release-map.json)"
          for (( i = 0; i < bottle_count; i++ )); do
            entry="$(jq -c ".bottles[${i}]" stage/release-map.json)"
            release_tag="$(jq -r .release_tag <<< "${entry}")"
            rel_fn="$(jq -r .release_filename <<< "${entry}")"

            sidecars=(
              "out/${rel_fn}.sha256"
              "out/${rel_fn}.spdx.json"
              "out/${rel_fn}.cdx.json"
              "out/${rel_fn}.intoto.jsonl"
              "out/${rel_fn}.lineage.intoto.jsonl"
              "out/${rel_fn}.sigstore.json"
              "out/${rel_fn}.spdx.sigstore.json"
              "out/${rel_fn}.provenance.json"
            )

            if [[ "${MODE}" == "publish" ]]; then
              if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
                draft_id="$(
                  gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                    jq -r --arg tag "${release_tag}" '[.[] | select(.draft == true and .tag_name == $tag)] | first | .id // empty'
                )"
                if [[ -z "${draft_id}" ]]; then
                  gh release create "${release_tag}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --draft \
                    --title "${release_tag}" \
                    --notes "Homebrew bottle and cryptographic build provenance for ${release_tag}."
                fi
              fi
              gh release upload "${release_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber \
                "work/${rel_fn}" \
                "${sidecars[@]}"
            else
              gh release upload "${release_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber \
                "${sidecars[@]}"
            fi
          done
