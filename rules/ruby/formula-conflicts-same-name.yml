id: formula-conflicts-same-name
language: Ruby
severity: error
message: Do not declare conflicts_with for same-named formulae across taps (tgrep, nats, herdr).
note: Declare conflicts_with only when a differently named formula installs overlapping binaries; users disambiguate same-named formulae with artagon/aitools/<name>.
files:
  - Formula/*.rb
rule:
  any:
    - pattern: conflicts_with "tgrep"
    - pattern: conflicts_with "tgrep", $$$OPTS
    - pattern: conflicts_with "nats"
    - pattern: conflicts_with "nats", $$$OPTS
    - pattern: conflicts_with "herdr"
    - pattern: conflicts_with "herdr", $$$OPTS
